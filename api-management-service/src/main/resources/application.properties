spring.application.name=api-management-service
server.port=8081

info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

spring.datasource.url=jdbc:postgresql://localhost:5432/gatekeeper_management
spring.datasource.username=postgres
spring.datasource.password=Learnjava

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true

security.jwt.expiration-seconds=3600
security.jwt.secret=gatekeeper-demo-jwt-secret-key-change-before-production